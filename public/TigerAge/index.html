<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover Tigers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <img src="back.jpeg" alt="Tiger Image" class="tiger-image">
    <div class="content">
      <h1>Discover Tigers</h1>
      <label for="tiger-age">Enter Tiger Age:</label>
      <input type="number" id="tiger-age" min="1" required>
      <button type="button" id="show-tigers">Show Tigers</button>
      <div id="results"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
